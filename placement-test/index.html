if(s.type==='welcome'){h=`<div class="tag">CAMBRIDGE THINK · DIAGNOSTIC</div><h1>Your English journey starts here.</h1>${helper('Emma','I’ll guide you through the test. Take your time and work independently.')}<p class="lead">Five original test sections, followed by up to three optional case challenges. Your main test has 112 points. Bonus cases can add up to 6 points.</p><div class="resultgrid"><div class="skill">⏱ <b>80 minutes</b><br><small>Timed diagnostic</small></div><div class="skill">🌈 <b>5 skill areas</b><br><small>Different aspects of English</small></div></div><p class="fine">The timer starts when you press Start. You can move back to previous questions before submitting. Wrong answers receive a −0.25 penalty; unanswered questions receive no penalty.</p>${btns(false,'Start diagnostic')}`}
if(s.type==='mcq'){let val=state.answers[s.id];h=`<div class="tag">SECTION 01 · GRAMMAR & VOCABULARY</div>${helper('Nick','Read the full sentence before choosing your answer.')}<div class="qtext">${esc(s.q).replace(/ {3,}/g,' <u>________</u> ')}</div><div class="options">${s.opts.map((o,i)=>`<button class="opt ${val===i?'selected':''}" data-opt="${i}"><span class="letter">${'ABC'[i]}</span>${esc(o)}</button>`).join('')}</div>${btns(true,'Continue')}`}
if(s.type==='functional'){h=`<div class="tag">SECTION 02 · FUNCTIONAL LANGUAGE</div>${helper('Emma','Complete the conversation. Drag each response into the correct gap. On a touchscreen, tap a response and then tap a gap.')}<p class="lead">Choose the best response for each gap. Two options are not needed.</p><div class="passage" style="max-height:34vh">${D.functionalText.replace(/\[(\d+)\]/g,(_,n)=>`<span class="drop ${state.functional[n]?'filled':''}" data-gap="${n}">${state.functional[n]?esc(state.functional[n]):'Drop '+n}</span>`)}</div><div class="bank">${D.functionalOptions.map(([k,v])=>`<div class="tile ${Object.values(state.functional).includes(k)?'used':''}" draggable="true" data-tile="${k}">${k}. ${esc(v)}</div>`).join('')}</div><div class="fine">Placed: ${Object.keys(state.functional).length} / 12 · You may move a response to another gap.</div>${btns(true,'Continue')}`}
if(s.type==='short'){let val=state.answers[s.id]||'';h=`<div class="tag">${s.section}</div>${s.audio?`<div class="audio"><small>ORIGINAL CAMBRIDGE LISTENING · PLAY AS NEEDED</small><audio controls preload="metadata"><source src="media/think_listening.mp3" type="audio/mpeg"></audio></div>`:''}${s.passage?`<div class="passage">${esc(s.passage)}</div>`:''}<div class="qtext">${esc(s.q)}</div><input class="answer" id="shortAnswer" value="${esc(val)}" placeholder="Type your answer…" autocomplete="off">${btns(true,'Continue')}`}
if(s.type==='dictation'){h=`<div class="tag">SECTION 05 · DICTATION</div>${helper('Leo','Your teacher reads each sentence three times. Type exactly what you hear.')}<p class="lead">Sentence ${s.number} of 5 · Maximum 2 points. This section is completed under teacher supervision.</p><textarea class="answer" id="dictAnswer" rows="3" placeholder="Type the sentence you hear…">${esc(state.answers[s.id]||'')}</textarea>${btns(true,'Continue')}`}
if(s.type==='case'){let c=s.c,val=state.cases[s.id];h=`<div class="tag">BONUS CHALLENGE ${s.number} · UP TO 2 POINTS</div><h1>${esc(c.title)}</h1><div class="casebox"><div class="caseintro">${esc(c.scenario)}</div></div><div class="qtext">${esc(c.q)}</div><div class="options">${c.opts.map((o,i)=>`<button class="opt ${val===i?'selected':''}" data-case="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div><p class="fine">Optional challenge. Your result in the main diagnostic test will not be reduced if you skip this task.</p>${btns(true,'Continue')}`}
if(s.type==='results'){h=resultsHTML()}
screen.innerHTML=h;wire(s)}
function wire(s){let prev=$('prevBtn'),next=$('nextBtn');if(prev)prev.onclick=()=>move(-1);if(next)next.onclick=()=>{saveInputs(s);if(s.type==='welcome')state.started=true;if(state.idx===coreEnd-1){state.idx++;render();return}if(state.idx===screens.length-2){state.idx++;render();return}move(1)};
screen.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let v=+b.dataset.opt,old=state.answers[s.id];if(old===undefined){state.answers[s.id]=v;if(v!==s.correct)state.penalty+=.25;beep(v===s.correct?660:190)}else if(old!==v){state.penalty-=old===s.correct?0:.25;state.answers[s.id]=v;if(v!==s.correct)state.penalty+=.25;beep(v===s.correct?660:190)}render()});
screen.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{state.cases[s.id]=+b.dataset.case;beep(560);render()});
if(s.type==='functional'){let dragged=null;screen.querySelectorAll('[data-tile]').forEach(t=>{t.addEventListener('dragstart',e=>{dragged=t.dataset.tile;e.dataTransfer.setData('text/plain',dragged)});t.onclick=()=>{dragged=t.dataset.tile;screen.querySelectorAll('.tile').forEach(x=>x.style.outline='');t.style.outline='2px solid #8d78c9'}});screen.querySelectorAll('[data-gap]').forEach(g=>{g.addEventListener('dragover',e=>e.preventDefault());g.addEventListener('drop',e=>{e.preventDefault();place(g.dataset.gap,e.dataTransfer.getData('text/plain')||dragged)});g.onclick=()=>{if(dragged)place(g.dataset.gap,dragged)}})}
}
function place(n,k){for(let key of Object.keys(state.functional))if(state.functional[key]===k)delete state.functional[key];state.functional[n]=k;beep(440);render()}
function saveInputs(s){if(s.type==='short'){state.answers[s.id]=$('shortAnswer')?.value.trim()||''}if(s.type==='dictation'){state.answers[s.id]=$('dictAnswer')?.value.trim()||''}}
function move(delta){let s=screens[state.idx];saveInputs(s);state.idx=Math.max(0,Math.min(screens.length-1,state.idx+delta));render()}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function answerMatches(input,key){
 let x=norm(input); if(!x) return false;
 let source=String(key||''); let variants=source.split('/').flatMap(v=>[norm(v),norm(v.replace(/\([^)]*\)/g,''))]).filter(Boolean);
 return variants.includes(x);
}
function getResults(){
 let raw=0,wrong=0,answered=0,dictationPending=0;
 let skill={'Grammar & Vocabulary':{got:0,max:66},'Functional Language':{got:0,max:12},'Reading':{got:0,max:12},'Listening':{got:0,max:12},'Dictation':{got:0,max:10}};
 D.grammar.forEach(q=>{let v=state.answers['g'+q.n];if(v!==undefined){answered++;if(v===q.correct){raw++;skill['Grammar & Vocabulary'].got++}else wrong++}});
 D.functionalKey.forEach((k,i)=>{let v=state.functional[String(i+1)];if(v){answered++;if(v===k){raw++;skill['Functional Language'].got++}else wrong++}});
 D.readingKey.forEach((k,i)=>{let v=state.answers['r'+i];if(v){answered++;if(answerMatches(v,k)){raw++;skill.Reading.got++}else wrong++}});
 D.listenAKey.forEach((k,i)=>{let v=state.answers['la'+i];if(v){answered++;if(answerMatches(v,k)){raw++;skill.Listening.got++}else wrong++}});
 D.listenBKey.forEach((k,i)=>{let v=state.answers['lb'+i];if(v){answered++;if(answerMatches(v,k)){raw++;skill.Listening.got++}else wrong++}});
 D.dictation.forEach((k,i)=>{let v=state.answers['d'+i];if(v){answered++;if(norm(v)===norm(k)){raw+=2;skill.Dictation.got+=2}else dictationPending++}});
 let bonus=0;D.cases.forEach((c,i)=>{if(state.cases['c'+i]!==undefined&&state.cases['c'+i]===c.correct)bonus+=2});
 let level=raw<=15?'A1':raw<=33?'A1':raw<=51?'A2':raw<=69?'B1':raw<=87?'B2':'C1';
 let label={A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper-Intermediate',C1:'Advanced'}[level];
 return {raw,penalty:state.penalty,bonus,wrong,answered,skill,level,label,dictationPending,unanswered:112-answered};
}
function resultsHTML(){let r=getResults();try{if(window.parent!==window)window.parent.postMessage({type:'LANGUAGE_JOURNEY_PLACEMENT_COMPLETE',payload:{raw:r.raw,penalty:r.penalty,bonus:r.bonus,wrong:r.wrong,answered:r.answered,skill:r.skill,level:r.level,label:r.label,dictationPending:r.dictationPending,unanswered:r.unanswered}},'*')}catch(e){}let profile=Object.entries(r.skill).map(([n,v])=>`<div class="skill"><div class="skillhead"><span>${n}</span><span>${Math.round(v.got/v.max*100)}%</span></div><div class="bar"><i style="width:${v.got/v.max*100}%"></i></div></div>`).join('');return `<div class="tag">YOUR DIAGNOSTIC REPORT</div><div class="badge"><span>🏆</span></div><h1 style="text-align:center">You did it!</h1><p class="lead" style="text-align:center">Your diagnostic journey is complete. Here is your provisional learning profile.</p><div style="text-align:center;padding:10px"><div class="tag">SYSTEM-ASSIGNED LEVEL</div><div style="font-size:58px;font-weight:800;background:linear-gradient(90deg,var(--pink),var(--orange),var(--blue),var(--violet));background-clip:text;color:transparent">${r.level}</div><b>${r.label}</b></div><div class="resultgrid"><div class="skill"><div class="tag">MAIN TEST</div><b style="font-size:25px">${r.raw.toFixed(2)} / 112</b></div><div class="skill"><div class="tag">BONUS CASES</div><b style="font-size:25px">+${r.bonus} / 6</b></div></div><h3>Skill profile</h3><div class="resultgrid">${profile}</div><div class="feedback"><b>Error analysis</b><br>${r.wrong} incorrect responses recorded. Game penalty: −${r.penalty.toFixed(2)} points (shown separately; it does not change the Cambridge score or assigned band). ${r.dictationPending} dictation response(s) need teacher review because the guide does not specify partial-marking rules. ${r.unanswered} main-test points remain unanswered.</div><div class="casebox"><b>Your learning pathway</b><div class="caseintro">The platform recommends the <b>${r.level}</b> course. Start with Module 1 and continue through the ten-module sequence. Your teacher should review open answers and any dictation responses flagged for manual marking before confirming this placement.</div></div><p class="fine">This is a prototype estimate based on the imported test and provisional project mapping. It is not an official Cambridge CEFR certification. The original Think score bands and the platform's CEFR mapping must be validated before deployment.</p><div class="navrow"><button class="btn alt" onclick="window.print()">Print report</button><button class="btn" onclick="location.reload()">Restart preview</button></div>`}
function beep(freq=440){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.14);o.stop(c.currentTime+.15);setTimeout(()=>c.close(),250)}catch(e){}}
$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent=state.sound?'🔊 Sound on':'🔇 Sound off'};
setInterval(()=>{if(!state.started||state.finished)return;state.seconds--;let m=Math.floor(state.seconds/60),s=state.seconds%60;$('timer').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;if([600,300,60].includes(state.seconds)){beep(880);$('timer').classList.add('warn')}if(state.seconds<=0){state.finished=true;state.idx=screens.length-1;render()}},1000);
render();
</script></body></html>
